baseURL = "http://localhost:1313/"
languageCode = "en-us"
title = "Amadeus (fork of Tau)"
enableRobotsTXT = true
publishDir = "public"

[markup.goldmark.renderer]
  unsafe = true

[markup.goldmark.parser]
  wrapStandAloneImageWithinParagraph = false

[markup.highlight]
  noClasses = false
  style = "monokai"

[params]
  description = "Amadeus — a downstream fork of Tau. This documentation site is not published."
  githubUrl = "https://github.com/Meteorite258/Ariadne"
  editRepoUrl = "https://github.com/Meteorite258/Ariadne/edit/main/website/content"
  githubRepo = "Meteorite258/Ariadne"

[outputs]
  home = ["HTML", "RSS"]

[module]
  [[module.mounts]]
    source = "content"
    target = "content"
  [[module.mounts]]
    source = "static"
    target = "static"
  [[module.mounts]]
    source = "data"
    target = "data"
  [[module.mounts]]
    source = "layouts"
    target = "layouts"
  [[module.mounts]]
    source = "assets"
    target = "assets"
  [[module.mounts]]
    source = "archetypes"
    target = "archetypes"
  [[module.mounts]]
    source = "../src/tau_coding/data/release-notes"
    target = "data/release-notes"
  [[module.mounts]]
    source = "../pyproject.toml"
    target = "data/project.toml"
